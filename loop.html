<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //looping a triangle
        for(let line="#"; line.length<8; line+="#"){
            console.log(line);
        }

        let line = "#";
        for(let x = 0; x <8 ; x++) {
            console.log(line);
            line += "#";
        }

        for(let x = 1; x <= 100; x++) {
            let output = "";
            if(x%3 ==0) output += "Fizz";
            if(x%5 ==0) output += "Buzz";

            console.log(output || x);
        }



        let size = 8;
        let board = "";
        for(let x = 0; x< size; x++){
            for(let y = 0; y< size; y++) {
                if((x+y)%2 == 0) {
                    board += "#";
                } else {
                    board += " ";
                }
            }
            board += "\n";
        }

        console.log(board);

    </script>
</body>
</html>
